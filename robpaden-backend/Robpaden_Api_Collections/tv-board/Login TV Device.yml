info:
  name: Login TV Device
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/tv/login"
  body:
    type: json
    data: |
      {
        "password": "your_tv_password",
        "deviceId": "example_device_id",
        "deviceName": "Chrome Browser"
      }
  auth: none

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
