info:
  name: Toggle Report Generation
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/manager/reports/toggle"
  body:
    type: json
    data: |-
      {
        "isActive": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
