info:
  name: Update Office Settings
  type: http
  seq: 3

http:
  method: PATCH
  url: "{{baseUrl}}/admin/v1/offices/{{companyId}}"
  body:
    type: json
    data: |
      {
        "companyName": "Dallas Sales HQ",
        "dailyGoal": 150,
        "weeklyGoal": 750,
        "monthlyGoal": 3000,
        "tvTheme": "light"
      }
  auth: inherit

runtime:
  variables:
    - name: baseUrl
      value: http://localhost:3030
    - name: companyId
      value: insert_uuid_here

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
